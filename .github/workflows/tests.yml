name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Testes (Chromium)
        run: npm test -- --retry 1
        env:
          HEADLESS: 'true'
          BROWSER: chromium
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - name: Guarda relatorio (Chromium)
        if: always()
        run: mv reports/cucumber-report.html reports/cucumber-report-chromium.html

      - name: Testes (Firefox)
        run: npm test -- --retry 1
        env:
          HEADLESS: 'true'
          BROWSER: firefox
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - name: Guarda relatorio (Firefox)
        if: always()
        run: mv reports/cucumber-report.html reports/cucumber-report-firefox.html

      - name: Testes (WebKit)
        run: npm test -- --retry 1
        env:
          HEADLESS: 'true'
          BROWSER: webkit
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - name: Guarda relatorio (WebKit)
        if: always()
        run: mv reports/cucumber-report.html reports/cucumber-report-webkit.html

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cucumber-report
          path: reports/cucumber-report-*.html
