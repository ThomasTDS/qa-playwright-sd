name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Testes (Chromium)
        run: npm test -- --retry 1
        env:
          HEADLESS: 'true'
          BROWSER: chromium
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - name: Guarda relatorio (Chromium)
        if: always()
        run: mv reports/cucumber-report.html reports/cucumber-report-chromium.html

      - name: Testes (Firefox)
        run: npm test -- --retry 1
        env:
          HEADLESS: 'true'
          BROWSER: firefox
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - name: Guarda relatorio (Firefox)
        if: always()
        run: mv reports/cucumber-report.html reports/cucumber-report-firefox.html

      - name: Testes (WebKit)
        run: npm test -- --retry 1
        env:
          HEADLESS: 'true'
          BROWSER: webkit
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - name: Guarda relatorio (WebKit)
        if: always()
        run: mv reports/cucumber-report.html reports/cucumber-report-webkit.html

      - name: Testes (Mobile - Pixel 7)
        run: npm test -- --tags "@mobile" --retry 1
        env:
          HEADLESS: 'true'
          DEVICE: mobile
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - name: Guarda relatorio (Mobile)
        if: always()
        run: mv reports/cucumber-report.html reports/cucumber-report-mobile.html

      - name: Gera relatorio Allure
        if: always()
        run: npm run allure:generate

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cucumber-report
          path: reports/cucumber-report-*.html

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-traces
          path: traces/*.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-videos
          path: videos/*.webm
          if-no-files-found: ignore

  deploy-pages:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixa o relatorio Allure gerado pelo job de testes
        uses: actions/download-artifact@v8
        with:
          name: allure-report
          path: allure-report

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
